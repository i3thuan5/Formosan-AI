[tox]
skipsdist = True

[flake8]
max-line-length = 180
exclude =
    .git
    .tox
    venv

[testenv:yamllint]
deps = 
    yamllint
commands =
    yamllint .

[testenv:flake8]
deps =
    flake8
commands =
    flake8 . --exclude=.git/,.tox/,venv/,*/migrations/,*/settings.py --show-source --count

[testenv:pymarkdown]
deps =
    pymarkdownlnt
commands =
    pymarkdown \
        --strict-config \
        --disable-rules md013,md029 \
        scan .

[testenv:shellcheck]
allowlist_externals =
    bash
commands =
    bash shellcheck.sh

[testenv:lockcheck]
skip_install = True
commands =
    python common/gpu_constraints.py --check
    python tests/check_lock_consistency.py \
        asr/requirements.txt \
        mt/requirements.txt \
        tts/requirements.txt

[testenv:production_tests]
deps = -r tests/production_tests/requirements.txt
passenv = BASE_URL
commands =
    python tests/production_tests/run_all.py {posargs}
