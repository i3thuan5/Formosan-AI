---
os: linux
dist: jammy
services:
  - docker
language: python
python:
  - '3.10'
before_install:
  - pip install --upgrade pip setuptools
branches:
  only:
    - main
    - asr-docker-cd
jobs:
  include:
    - name: Check YAML format
      install:
        - pip install tox
      script:
        - tox -e yamllint
    - name: pymarkdown
      install:
        - pip install tox
      script:
        - tox -e pymarkdown
    - name: flake8
      install:
        - pip install tox
      script:
        - tox -e flake8
    - name: Check Bash format
      install:
        - pip install tox
      script:
        - tox -e shellcheck
    - name: Check dependency lock consistency
      install:
        - pip install tox
      script:
        - tox -e lockcheck
    - name: Docker Build
      service:
        - docker
      before_script:
        - docker login -u "${DOCKER_USER}" -p "${DOCKER_TOKEN_PULL}"
        - docker buildx create --use --name formosan-ai
      # PR 的 token 沒有 push 權限，只讀 cache
      script:
        - CACHE=read docker buildx bake -f docker-bake.hcl --load
    - stage: Prepare for the Deployment
      name: Build Docker Container
      if: (type = push or type = cron) and (branch = main or branch = asr-docker-cd)
      service:
        - docker
      before_script:
        - docker login -u "${DOCKER_USER}" -p "${DOCKER_TOKEN_PUSH}"
        - docker buildx create --use --name formosan-ai
      script:
        # 寫 cache，下次 requirements 沒變就不用再從 PyPI 抓 torch
        - CACHE=readwrite docker buildx bake -f docker-bake.hcl --load
      after_success:
        - docker push ithuan/formosan-ai:asr
        - docker push ithuan/formosan-ai:asr-kaldi
        - docker push ithuan/formosan-ai:tts
        - docker push ithuan/formosan-ai:mt
